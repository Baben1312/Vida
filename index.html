<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Srećna godišnjica, Vido</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbeff3;--card:#fff9fb;--ink:#3b1030;--soft:#8c5a7c;--accent:#b8185b;--gold:#b8862b;--line:#efcddb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0b1a;--card:#2a1227;--ink:#fbe9f1;--soft:#c79ab9;--accent:#ff6fa5;--gold:#e8c26a;--line:#4a2243}}
:root[data-theme="dark"]{--bg:#1c0b1a;--card:#2a1227;--ink:#fbe9f1;--soft:#c79ab9;--accent:#ff6fa5;--gold:#e8c26a;--line:#4a2243}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.6;min-height:100vh;text-align:center;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:44px 22px 80px;position:relative;z-index:1}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(2.6rem,12vw,3.8rem);line-height:1.05;margin:0 0 10px;letter-spacing:-.01em}
.sub{color:var(--soft);margin:0 0 34px;font-size:1.02rem}
.count{border:1px solid var(--line);background:var(--card);border-radius:28px;padding:30px 18px 24px}
.days{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(5rem,26vw,7.5rem);line-height:1;color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}
.dl{margin:0 0 18px;color:var(--soft)}
.hms{display:flex;justify-content:center;gap:10px;color:var(--gold);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.7rem;font-variant-numeric:tabular-nums}
.hms small{display:block;font-family:"DM Sans",sans-serif;font-size:.78rem;color:var(--soft)}
.hms div{min-width:72px;padding:6px 0}
.next{margin:20px 0 0;font-size:.95rem;color:var(--soft)}
button{font:inherit;cursor:pointer}
.open{margin:34px 0 0;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 30px;font-weight:500;font-size:1.02rem}
.open:focus-visible,.gear:focus-visible,.panel button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.letter{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s ease}
.letter.on{grid-template-rows:1fr}
.letter>div{overflow:hidden}
.letter p{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.32rem;line-height:1.6;margin:26px 0 0;white-space:pre-line;text-align:left;border-left:2px solid var(--gold);padding-left:16px}
.sign{text-align:right!important;border:0!important;font-style:italic;color:var(--accent)}
.heart{position:fixed;bottom:-30px;font-size:20px;opacity:.0;animation:up linear forwards;pointer-events:none;z-index:0}
@keyframes up{0%{opacity:.0;transform:translateY(0)}15%{opacity:.5}100%{opacity:0;transform:translateY(-110vh) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.heart{display:none}.letter{transition:none}}
.gear{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--soft);z-index:5;font-size:18px}
.panel{position:fixed;inset:0;background:rgba(20,5,18,.55);z-index:9;display:none;align-items:flex-end;justify-content:center}
.panel.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));text-align:left}
.sheet h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.7rem;margin:0 0 4px}
.sheet p{margin:0 0 14px;color:var(--soft);font-size:.9rem}
label{display:block;font-size:.85rem;color:var(--soft);margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:170px}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;border-radius:999px;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row .save{background:var(--accent);border-color:var(--accent);color:#fff}
.sec{margin-top:48px}
.sec h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:2.1rem;margin:0 0 4px}
.sec .h{color:var(--soft);margin:0 0 18px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{min-height:118px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px;color:var(--ink);font-size:.93rem;line-height:1.35;transition:background .3s}
.card.front{font-family:"Cormorant Garamond",Georgia,serif;font-size:2.4rem;color:var(--accent)}
.card.open{background:var(--accent);color:#fff;border-color:var(--accent)}
.game{position:relative;height:300px;border:2px dashed var(--accent);border-radius:22px;background:var(--card);overflow:hidden}
.cat{position:absolute;font-size:36px;background:none;border:0;padding:6px;transition:left .45s,top .45s}
.score{margin:10px 0 0;color:var(--soft)}
.prize{display:none;margin-top:16px;border:2px dashed var(--gold);border-radius:18px;padding:18px;background:var(--card)}
.prize.on{display:block}
.prize b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.8rem;color:var(--accent)}
.conf{position:fixed;top:-30px;font-size:22px;z-index:20;pointer-events:none;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <section class="count" aria-live="off">
    <div class="days" id="d">0</div>
    <p class="dl">dana zajedno</p>
    <div class="hms">
      <div><span id="h">0</span><small>sati</small></div>
      <div><span id="m">0</span><small>minuta</small></div>
      <div><span id="s">0</span><small>sekundi</small></div>
    </div>
    <p class="next" id="next"></p>
  </section>
  <button class="open" id="btn">Otvori poruku 💌</button>
  <div class="letter" id="letter"><div>
    <p id="msg"></p>
    <p class="sign" id="sign"></p>
  </div></div>
  <section class='sec'><h2>Osam razloga zašto te VOLIIIMMMM 💖</h2><div class='cards' id='cards'></div></section>
  <section class='sec'><h2>Uhvati srce</h2><p class='h'>Uhvati 10 srca i otključaj iznenađenje.</p><div class='game' id='game'><button class='open' id='start' style='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0'>Počni 💖</button></div><p class='score' id='score'></p><div class='prize' id='prize'><b id='pt'></b><span id='pd'></span></div></section>
</main>

<div class="panel" id="panel"><div class="sheet">
  <h2>Prilagodi</h2>
  <p>Izmene se čuvaju samo na ovom uređaju. Za trajnu izmenu za sve, zatraži od Claudea da ažurira stranicu.</p>
  <label>Ime (nominativ)</label><input id="f_nom">
  <label>Zvanje (vokativ: „Vido“)</label><input id="f_voc">
  <label>Instrumental (sa „Vidom“)</label><input id="f_ins">
  <label>Datum početka</label><input id="f_date" type="date">
  <label>Potpis</label><input id="f_sender">
  <label>Poruka (koristi {voc}, {nom}, {ins})</label><textarea id="f_msg"></textarea>
  <div class="row"><button id="reset">Vrati početno</button><button id="close">Zatvori</button><button class="save" id="save">Sačuvaj</button></div>
</div></div>

<script>
var DEFAULTS={
  nom:"Vida", voc:"Vido", ins:"Vidom",
  date:"2025-10-28",
  sender:"– Baben",
  msg:"Zdravo ljubaviiiii, pre tačno godinu dana sam postao najsrećnija osoba ikadaaaaa!!\n\nU vezi smo već godinu dana.... HIHI NADAM SE DA ĆEMO BITI JOŠ MILION GODINA ZAJEDNOOO!!!\n\nUvek sam tu za tebe ako ti ikad išta zatreba, slobodno me pozovi, uvek kod mene možeš da dođeššš i uvek ću da brinem o tebiiiiiiiiiiiiiiii",
};
var KEY="godisnjica-v2", C=Object.assign({},DEFAULTS);
try{var sv=localStorage.getItem(KEY); if(sv) C=Object.assign(C,JSON.parse(sv));}catch(e){}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fill(t){
  return t.replace(/\{Voc\}/g,cap(C.voc)).replace(/\{voc\}/g,C.voc)
          .replace(/\{Nom\}/g,cap(C.nom)).replace(/\{nom\}/g,C.nom)
          .replace(/\{Ins\}/g,cap(C.ins)).replace(/\{ins\}/g,C.ins);
}
function pad(n){return n<10?"0"+n:""+n}
var MES=["januar","februar","mart","april","maj","jun","jul","avgust","septembar","oktobar","novembar","decembar"];
function parts(){var p=C.date.split("-");return {y:+p[0],m:+p[1]-1,d:+p[2]}}

function render(){
  var st=parts(), now=new Date(), start=new Date(st.y,st.m,st.d);
  var years=now.getFullYear()-st.y;
  var thisYear=new Date(now.getFullYear(),st.m,st.d);
  if(now<thisYear) years--;
  var isDay=now.getMonth()===st.m&&now.getDate()===st.d&&years>=1;
  var t=document.getElementById("title"), sub=document.getElementById("sub");
  t.textContent = isDay ? "Srećna godišnjica, "+C.voc+"!" : "Ljubav za "+C.ins.replace(/^./,function(c){return c});
  if(!isDay) t.textContent = "Za tebe, "+C.voc;
  var ord = years===1 ? "prva" : years+".";
  sub.textContent = isDay ? "Danas je naša "+ord+" godišnjica." : "Zajedno od "+st.d+". "+MES[st.m]+" "+st.y+".";
  document.title = isDay ? "Srećna godišnjica, "+C.voc : "Za tebe, "+C.voc;
  document.getElementById("msg").textContent=fill(C.msg);
  document.getElementById("sign").textContent=C.sender+(C.sender? "":"");
  tick();
}
function tick(){
  var st=parts(), start=new Date(st.y,st.m,st.d), now=new Date();
  var diff=Math.max(0,now-start), s=Math.floor(diff/1000);
  document.getElementById("d").textContent=Math.floor(s/86400);
  document.getElementById("h").textContent=pad(Math.floor(s%86400/3600));
  document.getElementById("m").textContent=pad(Math.floor(s%3600/60));
  document.getElementById("s").textContent=pad(s%60);
  var nx=new Date(now.getFullYear(),st.m,st.d);
  if(now>=new Date(now.getFullYear(),st.m,st.d+1)) nx=new Date(now.getFullYear()+1,st.m,st.d);
  var n=document.getElementById("next");
  if(now.getMonth()===st.m&&now.getDate()===st.d){n.textContent="Danas slavimo nas dvoje. 💞"}
  else{var dd=Math.ceil((nx-now)/86400000);n.textContent="Do sledeće godišnjice: "+dd+(dd%10===1&&dd%100!==11?" dan":" dana")}
}
render(); setInterval(tick,1000);

var btn=document.getElementById("btn"), letter=document.getElementById("letter");
btn.onclick=function(){
  var on=letter.classList.toggle("on");
  btn.textContent=on?"Zatvori poruku":"Otvori poruku 💌"; if(on)confetti();
  if(on) setTimeout(function(){letter.scrollIntoView({behavior:"smooth",block:"nearest"})},300);
};

function hearts(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  var h=document.createElement("span");h.className="heart";
  h.textContent=["❤","💗","💕"][Math.floor(Math.random()*3)];
  h.style.left=Math.random()*96+"%";h.style.animationDuration=(7+Math.random()*6)+"s";
  document.body.appendChild(h);setTimeout(function(){h.remove()},13500);
}
setInterval(hearts,1400);

var REASONS=['Zato što si uvek tu kad mi trebaš','Zato što si najlepša devojka ikadaaaa 😍','Zato što brineš o meni','Zato što me razumeš','Zato što smo ISTIIIIII','Zato što si jakooo pametna i poslušnaa','Zato što si jedna u TRILIONNNN','Zato što…','Ne bi svi razlozi stali na jedan sajt, sorry… 😅'];
var PRIZE='Jedna večera po tvom izboru i milion kissesssssss 🍽️😘';
function confetti(n){n=n||40;if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var e=['🎉','💖','✨','🌸','💗'];for(var i=0;i<n;i++)(function(){var c=document.createElement('span');c.className='conf';c.textContent=e[Math.floor(Math.random()*e.length)];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(function(){c.remove()},3600)})()}
var cardsEl=document.getElementById('cards');
REASONS.forEach(function(r,i){var L=i===8?'🎁':i+1;var b=document.createElement('button');b.className='card front';b.textContent=L;if(i===8)b.style.gridColumn='1 / -1';b.onclick=function(){var o=b.classList.toggle('open');b.classList.toggle('front',!o);b.textContent=o?fill(r):L;if(o)confetti(8)};cardsEl.appendChild(b)});
var g=document.getElementById('game'),sc=document.getElementById('score'),pr=document.getElementById('prize'),score=0,heart,timer;
function mv(){heart.style.left=Math.random()*(g.clientWidth-56)+'px';heart.style.top=Math.random()*(g.clientHeight-56)+'px'}
document.getElementById('start').onclick=function(){
 this.style.display='none';score=0;sc.textContent='Uhvaćeno: 0 / 10';
 heart=document.createElement('button');heart.className='cat';heart.textContent='💖';heart.setAttribute('aria-label','Uhvati srce');g.appendChild(heart);mv();
 heart.onclick=function(){score++;sc.textContent='Uhvaćeno: '+score+' / 10';if(score>=10){clearInterval(timer);heart.remove();document.getElementById('pt').textContent='Bravo, '+C.voc+'! 🏆';document.getElementById('pd').textContent=fill(PRIZE);pr.classList.add('on');confetti(70);return}mv()};
 timer=setInterval(mv,1100)};

var panel=document.getElementById("panel");
var ids={nom:"f_nom",voc:"f_voc",ins:"f_ins",date:"f_date",sender:"f_sender",msg:"f_msg"};
document.getElementById("gear").onclick=function(){
  for(var k in ids) document.getElementById(ids[k]).value=C[k];
  panel.classList.add("on");
};
document.getElementById("close").onclick=function(){panel.classList.remove("on")};
document.getElementById("save").onclick=function(){
  for(var k in ids){var v=document.getElementById(ids[k]).value.trim(); if(v) C[k]=v;}
  try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}
  panel.classList.remove("on"); render();
};
document.getElementById("reset").onclick=function(){
  try{localStorage.removeItem(KEY)}catch(e){}
  C=Object.assign({},DEFAULTS); panel.classList.remove("on"); render();
};
</script>
</body>
</html>
